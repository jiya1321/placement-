    <script>
      // Clear any legacy Service Workers from previous projects running on localhost
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var r of registrations) {
            r.unregister().then(function(unregistered) {
              if (unregistered) console.log('[PlacePilot] Unregistered legacy service worker:', r);
            });
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var name of names) {
            caches.delete(name);
            console.log('[PlacePilot] Cleared cache storage:', name);
          }
        });
      }
    </script>
